# The framework's own gate, the same goal as locally and in hooks/pre-push: vet, conventions, tests,
# the planning-document checks and no private data (CONTRIBUTING.md says what each one checks).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # make ci only reads git
          fetch-depth: 0 # roadmap-check reads the history since the last review
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # the engine has no dependencies, so there is no go.sum to key a cache on
      - name: make ci
        run: make ci
