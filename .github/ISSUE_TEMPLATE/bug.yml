name: Bug report
description: Something in DUDES does not do what the docs say
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Be specific. A security vulnerability does not belong here: report it privately, see the
        [security policy](https://github.com/Thomas-Pietsch/dudes/security/policy).
        Remove secrets and private code from anything you paste.
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output, the error, the file or rule that is wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands, in order, starting from a clone.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: door
    attributes:
      label: Which way in?
      options:
        - IDE agent with the rule files
        - Engine with stub workers (make try)
        - Engine with local models
        - Bench
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The output of `dudes version` and of `git rev-parse --short HEAD` in your clone."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows (Git Bash, Docker Engine in WSL2)
        - Windows (other)
        - Other
  - type: textarea
    id: doctor
    attributes:
      label: Output of dudes doctor
      description: Run it in the repo where the problem shows. Remove anything private.
      render: text
  - type: textarea
    id: involved
    attributes:
      label: Files or rules involved
      description: Which files, rules or commands, if you know.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I removed secrets and private code from what I pasted.
          required: true
        - label: This is not a security vulnerability.
          required: true
