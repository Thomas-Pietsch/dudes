# Version updates for what the repo pins: the CI actions (by SHA) and the worker image's base.
# The engine has no Go dependencies, so there is no gomod entry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker/worker
    schedule:
      interval: weekly
    ignore:
      # Aider pins the Python range: aider-chat 0.86.2 requires <3.13. Lift when its pins change or Aider is dropped.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
